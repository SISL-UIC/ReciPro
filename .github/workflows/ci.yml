name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  resx-conventions:
    name: resx conventions (text-only / no baked language / font tiers)
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - name: Check resx conventions
      run: python .github/scripts/check_resx_conventions.py
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push: null
  pull_request: null
